name: Public website quality

on:
  pull_request:
  push:
    branches:
      - main
      - launch/public-flodesk-only

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check encoding
        run: npm run check:encoding

      - name: Lint public source
        run: npm run lint

      - name: Build production website
        run: npm run build

      - name: Validate public release boundaries
        run: npm run public:check

      - name: Run production policy tests
        run: npm test

      - name: Audit production dependencies
        run: npm run audit:production
